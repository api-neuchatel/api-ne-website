<article class="bg-white nested-copy-line-height h-100">
  <div class="grid grid-cols-1 md:grid-cols-2 gap-4 pa4 gray overflow-hidden h-100">
    <div class="flex items-start justify-center">
      {{ with .Params.image }}
        <img src="{{ . }}" alt="{{ $.Title }}" class="db br-100 grayscale" style="width: 320px; height: 320px; max-width: 100%; object-fit: cover;" loading="lazy" />
      {{ end }}
    </div>
    <div>
      <h3 class="f3 near-black mt0 mb2">
        <a href="{{ .RelPermalink }}" class="link black dim">{{ .Title }}</a>
      </h3>
      {{ with .Params.role }}
        <p class="f5 mt0 mb3">{{ . }}</p>
      {{ end }}
      <div class="nested-links f5 lh-copy">
        {{ .Summary }}
      </div>
      <div class="mt3">
        {{ with .Params.linkedin }}
          <a href="{{ . }}" class="link dim mr3" target="_blank" rel="noopener noreferrer">LinkedIn</a>
        {{ end }}
        {{ with .Params.github }}
          <a href="{{ . }}" class="link dim mr3" target="_blank" rel="noopener noreferrer">GitHub</a>
        {{ end }}
        {{ with .Params.email }}
          <a href="mailto:{{ . }}" class="link dim">Email</a>
        {{ end }}
      </div>
    </div>
  </div>
</article>
